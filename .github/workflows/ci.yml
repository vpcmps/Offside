name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Offside.sln

      - name: Build
        run: dotnet build Offside.sln -c Release --no-restore

      - name: Test
        run: dotnet test Offside.sln -c Release --no-build --no-restore --logger "trx;LogFilePrefix=test"

      - name: Pack
        run: dotnet pack Offside.sln -c Release --no-build --no-restore -o artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 7
